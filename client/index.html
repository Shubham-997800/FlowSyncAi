    <script>
      (function(){try{var m=localStorage.getItem('theme-mode');if(!m){var t=localStorage.getItem('theme');if(t==='dark')m='dark';else if(t==='light')m='light'}var dark=m==='dark'||((!m||m==='system')&&window.matchMedia('(prefers-color-scheme:dark)').matches);var r=document.documentElement;if(dark){r.classList.add('dark');r.style.colorScheme='dark'}else{r.classList.remove('dark');r.style.colorScheme='light'}}catch(e){}})();
    </script>
